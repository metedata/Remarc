		A1MCP0012DEDD000000000001 /* Copy MCP Server */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
				"$(SRCROOT)/../mcp/vendor/remarc-mcp.js",
				"$(SRCROOT)/../mcp/vendor/PROVENANCE.json",
				"$(SRCROOT)/../mcp/skill/SKILL.md",
			);
			name = "Copy MCP Server";
			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/remarc-mcp.js",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/remarc-skill.md",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Fail the build rather than shipping whatever happens to be on disk.\nset -euo pipefail\n\n# The server is vendored from the plugin repo, which owns it - refresh it\n# with scripts/sync-mcp-vendor.sh. This phase used to build a gitignored\n# mcp/dist, so a clean checkout shipped nothing and a stale tree shipped a\n# server months old, silently either way.\nVENDOR=\"${SRCROOT}/../mcp/vendor\"\ntest -s \"$VENDOR/remarc-mcp.js\"\ntest -s \"$VENDOR/PROVENANCE.json\"\n\n# The recorded hash must match the bytes, or the vendor was edited by hand.\nEXPECTED=$(/usr/bin/python3 -c \"import json;print(json.load(open('$VENDOR/PROVENANCE.json'))['sha256'])\")\nACTUAL=$(/usr/bin/shasum -a 256 \"$VENDOR/remarc-mcp.js\" | /usr/bin/awk '{print $1}')\nif [ \"$EXPECTED\" != \"$ACTUAL\" ]; then\n  echo \"error: mcp/vendor/remarc-mcp.js does not match its recorded sha256\" >&2\n  exit 1\nfi\n\nRES=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\ncp \"$VENDOR/remarc-mcp.js\" \"$RES/remarc-mcp.js\"\ncp \"${SRCROOT}/../mcp/skill/SKILL.md\" \"$RES/remarc-skill.md\"\n";
		};
