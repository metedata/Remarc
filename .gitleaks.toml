# Gitleaks configuration for the Remarc repo.
[extend]
useDefault = true

[allowlist]
description = "Known non-secrets"
paths = [
  # Webhook signing tests use whsec_dGVzdHNlY3JldA== - base64 of the literal
  # string "testsecret", a deliberate fixture, not a credential.
  '''app/RemarcPackage/Tests/RemarcFeatureTests/WebhookTests\.swift''',
]
regexes = [
  # Cross-language OMP lease fixtures use this obvious repeated hex value for
  # owner-token shape coverage. Production tokens are generated at runtime.
  '''0123456789abcdef0123456789abcdef''',
]
